name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # O composer.json declara php ^8.0. A matriz cobre o piso e o topo:
        # sem o 8.1 aqui, uma sintaxe de 8.3 passaria no CI e quebraria em
        # quem ainda roda a versão mínima que o pacote promete suportar.
        php: ['8.1', '8.4']
        stability: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: ./vendor/bin/pest
